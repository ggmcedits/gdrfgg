plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var props = [minecraft_version: minecraft_version, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, geckolib_version: geckolib_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
